[project]
name = "uk-car-advisor"
version = "0.1.0"
description = "Local Windows 11 UK used-car advisor (Streamlit + Playwright + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36.0",
    "httpx>=0.27.0",
    "playwright>=1.45.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

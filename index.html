<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Log">
  <meta name="theme-color" content="#007AFF">
  <title>Log</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="ios.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen">
    <div class="login-icon">📦</div>
    <h1 class="login-title">Log</h1>
    <p class="login-subtitle">Sign in to continue</p>
    <div id="googleSignInBtn"></div>
    <p id="loginError" class="hidden" style="color:#FF3B30;margin-top:16px;font-size:14px;"></p>
  </div>

  <!-- Main App -->
  <div id="mainApp" class="hidden">
    <div id="installBanner" class="install-banner hidden">
      <div class="install-banner-content">
        <strong>📲 Add to Home Screen</strong>
        <p>Tap <span class="install-share">Share ⬆️</span> → <strong>Add to Home Screen</strong></p>
        <p class="install-zh">點 <span class="install-share">分享</span> → <strong>加入主畫面</strong></p>
      </div>
      <button type="button" id="dismissInstallBanner" class="install-dismiss" aria-label="Dismiss">×</button>
    </div>
    <div class="app-container">

      <!-- Nav Bar -->
      <header class="ios-navbar">
        <div class="ios-nav-row">
          <h1 class="ios-large-title" id="navTitle">Log Item</h1>
          <button class="ios-text-btn" id="signOutBtn">Sign out</button>
        </div>
      </header>

      <!-- LOG SCREEN -->
      <div id="screenLog" class="screen active">
        <div class="ios-btn-row">
          <button class="ios-btn-secondary" id="takePhotoBtn">📷 拍照</button>
          <button class="ios-btn-secondary" id="importPhotoBtn">🖼 匯入照片</button>
        </div>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
        <input type="file" id="importInput" accept="image/*" class="hidden">

        <div id="photoPreviewWrap" class="photo-preview-wrap hidden">
          <img id="photoPreview" class="photo-preview" alt="Preview">
          <div id="photoLoading" class="photo-loading hidden">
            <div class="photo-loading-inner">
              <div class="spinner"></div>
              <p id="photoStatusText" class="photo-status-text">Preparing photo…</p>
            </div>
          </div>
          <button class="change-photo-btn" id="changePhotoBtn">Change photo</button>
        </div>

        <p class="ios-section-header">Transport 運送方式</p>
        <div class="ios-segmented">
          <button class="ios-segment active" data-mode="shipped" id="modeShipped">寄箱 Shipped</button>
          <button class="ios-segment" data-mode="handcarry" id="modeHandCarry">手提 Hand Carry</button>
        </div>

        <p class="ios-section-header">Item Details 物品資料</p>
        <div class="ios-group">
          <div class="ios-row" id="locationRowShipped">
            <span class="ios-row-label">箱號 Box</span>
            <input class="ios-input" id="boxNumber" type="text" placeholder="e.g. 1, 12">
          </div>
          <div class="ios-row hidden" id="locationRowHandCarry">
            <span class="ios-row-label">存放位置</span>
            <button class="ios-text-btn" id="handCarryPickerBtn" style="padding:0;">Select bag ›</button>
          </div>
          <div class="ios-row">
            <span class="ios-row-label">房間分類</span>
            <input class="ios-input" id="roomCategory" type="text" placeholder="客廳, 睡房...">
          </div>
          <div class="ios-row" style="flex-direction:column;align-items:stretch;">
            <span class="ios-row-label" style="margin-bottom:8px;">物品描述 (ToR1)</span>
            <textarea class="ios-textarea" id="itemDescription" placeholder="e.g. Used clothing"></textarea>
          </div>
          <div class="ios-row">
            <span class="ios-row-label">數量 Qty</span>
            <input class="ios-input" id="quantity" type="number" min="1" value="1">
          </div>
          <div class="ios-row">
            <span class="ios-row-label">尺寸 Size</span>
            <input class="ios-input" id="size" type="text" placeholder="optional">
          </div>
          <div class="ios-row">
            <span class="ios-row-label">重量 Weight</span>
            <input class="ios-input" id="weight" type="text" placeholder="e.g. 2kg">
          </div>
          <div class="ios-row">
            <span class="ios-row-label">預估價值 £</span>
            <input class="ios-input" id="estimatedValue" type="text" placeholder="e.g. 20">
          </div>
          <div class="ios-row">
            <span class="ios-row-label">狀態 Status</span>
            <button class="ios-text-btn" id="statusPickerBtn" style="padding:0;">待整理 ›</button>
          </div>
        </div>

        <button class="ios-btn-primary" id="saveBtn">Save to Google Drive</button>
        <button type="button" class="ios-btn-secondary hidden" id="cancelEditBtn" style="margin-top:10px;">Cancel edit 取消編輯</button>
      </div>

      <!-- ITEMS SCREEN -->
      <div id="screenItems" class="screen">
        <div class="ios-search-wrap">
          <span class="ios-search-icon">🔍</span>
          <input class="ios-search" id="searchInput" type="search" placeholder="搜尋箱號或物品描述…" autocomplete="off">
          <button class="ios-search-clear" id="searchClear">×</button>
        </div>
        <div class="ios-progress-bar" id="progressBar">Loading…</div>
        <div class="ios-chips" id="transportChips">
          <button class="ios-chip active" data-transport="">全部</button>
          <button class="ios-chip" data-transport="寄箱">寄箱</button>
          <button class="ios-chip" data-transport="手提">手提</button>
        </div>
        <div class="ios-chips" id="statusChips">
          <button class="ios-chip active" data-status="">All status</button>
          <button class="ios-chip" data-status="待整理">待整理</button>
          <button class="ios-chip" data-status="待打包">待打包</button>
          <button class="ios-chip" data-status="已打包">已打包</button>
          <button class="ios-chip" data-status="已入箱">已入箱</button>
          <button class="ios-chip" data-status="已寄出">已寄出</button>
        </div>
        <p class="result-count" id="resultCount"></p>
        <p class="swipe-hint">← 左滑：改狀態（綠） · 右滑：Edit / Delete →</p>
        <div id="itemList"></div>
      </div>

      <!-- BOXES SCREEN -->
      <div id="screenBoxes" class="screen">
        <div class="ios-progress-bar" id="progressBarBoxes">Loading…</div>
        <div id="boxSummary"></div>
      </div>

    </div>

    <!-- Tab Bar -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="log">
        <span class="tab-icon">➕</span>Log
      </button>
      <button class="tab-btn" data-tab="items">
        <span class="tab-icon">📋</span>Items
      </button>
      <button class="tab-btn" data-tab="boxes">
        <span class="tab-icon">📦</span>Boxes
      </button>
    </nav>
  </div>

  <!-- Action Sheet -->
  <div class="action-sheet-overlay" id="actionSheetOverlay">
    <div class="action-sheet">
      <div class="action-sheet-group" id="actionSheetOptions"></div>
      <div class="action-sheet-group">
        <button class="action-sheet-btn" id="actionSheetCancel">Cancel</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
